name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: koperasi_jabar_test
          MARIADB_USER: koperasi_test
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, bcmath, intl, xml, curl, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Siapkan environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Test suite (SQLite)
        run: php artisan test --no-coverage

      - name: Test suite (MariaDB 10.11)
        run: |
          cp phpunit.mariadb.xml.example phpunit.mariadb.xml
          sed -i 's/value="CHANGE_ME"/value="secret"/' phpunit.mariadb.xml
          php vendor/bin/phpunit -c phpunit.mariadb.xml --no-coverage

      - name: Pint
        run: vendor/bin/pint --test

      - name: Composer audit
        run: composer audit
